[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xblock-accordion"
dynamic = ["version"]
description = "Accordion XBlock"
readme = "README.rst"
license = {file = "LICENSE.txt"}
requires-python = ">=3.11"
authors = [
    { name = "OpenCraft", email = "help+xblock@opencraft.com" },
]
keywords = [
    "Python",
    "edx",
    "XBlock",
    "openedx",
    "TypeScript",
    "plugin",
    "tsx",
    "jsx",
    "vite",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "edx-i18n-tools",
    "nh3",
    "XBlock[django]",
    "xblock-utils",
]

[project.entry-points."xblock.v1"]
accordion = "accordion:AccordionXBlock"

[project.urls]
Homepage = "https://github.com/open-craft/xblock-accordion"

[dependency-groups]
test = [
    "code-annotations",  # provides commands used by the pii_check make target
    "pytest",
    "pytest-cov",
    "pytest-django",
    "xblock-sdk",  # provides workbench settings for testing
]
quality = [
    { include-group = "test" },
    "edx-lint",  # edX pylint rules and plugins
    "isort",
    "pycodestyle",
    "pydocstyle",
]
doc = [
    { include-group = "test" },
    "doc8",  # reStructuredText style checker
    "sphinx",
    "sphinx-book-theme",  # Common theme for all Open edX projects
    "twine",  # Validates README.rst for usage on PyPI
]
dev = [
    { include-group = "quality" },
    { include-group = "doc" },
    "diff-cover",
]

[tool.uv]
default-groups = ["dev"]
# Mirrors the relevant entries of the edx-lint common constraints:
# https://github.com/edx/edx-lint/blob/master/edx_lint/files/common_constraints.txt
constraint-dependencies = [
    "Django<6.0",
]

[tool.hatch.version]
path = "accordion/__init__.py"

[tool.hatch.build.targets.sdist]
include = [
    "/accordion",
    "/CHANGELOG.rst",
    "/LICENSE.txt",
    "/README.rst",
]

[tool.hatch.build.targets.wheel]
packages = ["accordion"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "workbench.settings"
addopts = "--cov accordion --cov-report term-missing --cov-report xml"
norecursedirs = [".*", "docs", "site-packages"]

[tool.isort]
include_trailing_comma = true
indent = '    '
line_length = 120
multi_line_output = 3
skip = ["migrations"]

[tool.doc8]
# D001 = Line too long
ignore = ["D001"]

[tool.pydocstyle]
# D101 = Missing docstring in public class
# D200 = One-line docstring should fit on one line with quotes
# D203 = 1 blank line required before class docstring
# D212 = Multi-line docstring summary should start at the first line
# D215 - D414 = numpy style section rules
ignore = "D101,D200,D203,D212,D215,D404,D405,D406,D407,D408,D409,D410,D411,D412,D413,D414"
match-dir = "(?!migrations)"
